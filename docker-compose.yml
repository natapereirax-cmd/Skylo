services:
  backend:
    build: ./backend
    image: natep20/skylo-backend:latest
    env_file:
      - ./backend/.env
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: natep20/skylo-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped